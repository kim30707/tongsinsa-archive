<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>조선통신사 AI 체험 자료함</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&display=swap">
<style>
:root{--bg:#edf1f0;--panel:#fbfcfb;--ink:#17233f;--muted:#55627a;--line:#c6d0d2;--indigo:#23407a;--on:#fff;--gold:#a97c12;--bad:#ab3440;--sunk:#dfe6e5;
--display:"Song Myung","AppleMyungjo","Nanum Myeongjo",serif;--body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10172a;--panel:#18213a;--ink:#e7ecf5;--muted:#a4b0c6;--line:#303c5a;--indigo:#86a5e6;--on:#10172a;--gold:#e3b84f;--bad:#f19aa3;--sunk:#0c1324;color-scheme:dark}}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);word-break:keep-all}
.gate{min-height:100vh;box-sizing:border-box;display:grid;place-items:center;padding:32px 16px}
form{width:100%;max-width:440px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);padding:28px 24px;display:grid;gap:14px}
h1{font:400 28px/1.3 var(--display);margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--muted);font-size:15px}
.field{display:grid;gap:6px}
label{font-size:15px;font-weight:700}
input[type=text],input[type=password]{font:inherit;padding:11px 12px;width:100%;box-sizing:border-box;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.notice{background:var(--sunk);padding:12px 14px;border-radius:4px;font-size:14px;display:grid;gap:6px}
.agree{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-weight:400;font-size:15px}
.agree input{width:18px;height:18px;margin:3px 0 0}
button{font:inherit;font-weight:700;padding:12px 14px;background:var(--indigo);color:var(--on);border:0;border-radius:4px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{min-height:1.6em;color:var(--bad);font-size:15px}
.by{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main class="gate">
<form id="f">
<h1>조선통신사 AI 체험 자료함</h1>
<p class="sub">안내받은 비밀번호와 이름, 소속을 입력하면 자료가 열립니다.</p>
<div class="field"><label for="name">이름</label><input id="name" type="text" maxlength="60" autocomplete="name" required></div>
<div class="field"><label for="org">소속</label><input id="org" type="text" maxlength="80" autocomplete="organization" required></div>
<div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="off" required></div>
<div class="notice">
<p><strong>접속 기록 안내</strong></p>
<p>셈제작소는 자료 보호와 분쟁 대응을 위해 입력하신 이름·소속, 접속·내려받기 시각과 항목, IP 주소, 접속 지역, 기기 정보, 비밀유지 동의 여부를 기록하고 3년간 보관합니다.</p>
</div>
<label class="agree"><input id="agree" type="checkbox" required><span>위 기록에 동의하며, 이 자료의 내용을 셈제작소의 허락 없이 복제·사용하거나 다른 사람에게 제공하지 않겠습니다.</span></label>
<button id="go" type="submit">동의하고 열기</button>
<p class="msg" id="msg" role="alert"></p>
<p class="by">제작 · 셈제작소</p>
</form>
</main>
<script>
var API='https://tongsinsa-archive.sem-archive.workers.dev';
var $=function(i){return document.getElementById(i)};
$('f').addEventListener('submit',function(ev){
  ev.preventDefault();$('go').disabled=true;$('go').textContent='여는 중';$('msg').textContent='';
  function fail(t){$('go').disabled=false;$('go').textContent='동의하고 열기';$('msg').textContent=t}
  fetch(API+'/enter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,org:$('org').value,password:$('pw').value,agree:$('agree').checked})})
  .then(function(r){return r.json().then(function(j){return{s:r.status,j:j}})})
  .then(function(x){
    if(x.s===200){document.open();document.write(x.j.html);document.close();return}
    if(x.s===401){fail('비밀번호가 맞지 않습니다. 다시 입력해 주세요.');$('pw').select();return}
    if(x.s===429){fail('시도가 너무 많습니다. 15분 뒤에 다시 해 주세요.');return}
    if(x.s===400){fail('이름, 소속, 동의 항목을 모두 입력해 주세요.');return}
    fail('자료를 열지 못했습니다. 잠시 뒤 다시 해 주세요.');
  }).catch(function(){fail('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 해 주세요.')});
});
</script>
</body>
</html>
